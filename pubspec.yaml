
name: app_diet_ai
description: "Contador de calorias: Eatfox"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_generative_ai: ^0.4.7
  google_fonts: ^6.1.0
  reorderables: ^0.6.0
  http: ^1.2.0
  camera: ^0.11.0 
  translator: ^1.0.1+1
  path_provider: ^2.1.2
  google_mlkit_text_recognition: ^0.11.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.7
  video_player: ^2.8.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  url_launcher: ^6.2.6
  cloud_firestore: ^4.15.8
  google_sign_in: ^6.2.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  firebase_storage: ^11.7.7
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/foxicon2.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf